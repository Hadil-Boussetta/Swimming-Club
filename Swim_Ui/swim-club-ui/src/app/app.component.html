<ng-container *ngIf="!isAuthRoute; else authLayout">
  <div class="flex h-screen w-full bg-slate-50 overflow-hidden text-slate-800">
    <!-- Sidebar Container -->
    <aside class="w-64 flex-shrink-0 h-full border-r border-slate-200 bg-white shadow-sm z-20 relative">
      <app-sidebar></app-sidebar>
    </aside>

    <!-- Main Area Container -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">
      <!-- Header -->
      <header class="h-16 flex-shrink-0 border-b border-slate-200 glass z-10 w-full px-6 flex items-center">
        <app-header class="w-full"></app-header>
      </header>

      <!-- Content Area -->
      <main class="flex-1 overflow-x-hidden overflow-y-auto bg-background transition-colors duration-300">
        <div class="container mx-auto py-10 px-6 sm:px-8 max-w-[1400px]">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>
  </div>
</ng-container>

<ng-template #authLayout>
  <div class="min-h-screen w-full bg-slate-50 text-slate-800">
    <router-outlet></router-outlet>
  </div>
</ng-template>
