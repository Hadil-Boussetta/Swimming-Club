<div class="min-h-screen flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1519315901367-f34ff9154fa6?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center relative py-12">
  <!-- Overlay -->
  <div class="absolute inset-0 bg-slate-900/70 backdrop-blur-sm"></div>

  <!-- Register Card -->
  <div class="relative z-10 w-full max-w-lg">
    <div class="glass-dark border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
      <!-- Header -->
      <div class="flex flex-col items-center mb-8">
        <h1 class="text-3xl font-bold text-white tracking-tight text-center">Join SwimClubOS</h1>
        <p class="text-slate-400 text-sm mt-3 text-center">Create an account to manage your club, swimmers, and schedules efficiently.</p>
      </div>

      <!-- Form -->
      <form class="space-y-5">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">First Name</label>
            <input type="text" placeholder="John" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Last Name</label>
            <input type="text" placeholder="Doe" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Email <span class="text-pool">*</span></label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input type="email" placeholder="name@example.com" class="w-full pl-10 pr-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Club Role</label>
          <div class="relative">
             <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
             <select class="w-full pl-10 pr-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white appearance-none">
               <option value="admin">Club Administrator</option>
               <option value="coach">Head Coach</option>
               <option value="manager">Team Manager</option>
             </select>
             <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
             </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Confirm Password</label>
            <input type="password" placeholder="••••••••" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
        </div>

        <div class="flex items-start mt-2">
          <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-slate-600 bg-slate-800/50 text-pool focus:ring-pool focus:ring-offset-slate-900 border">
          <label for="terms" class="ml-2 text-sm text-slate-400">I agree to the <a href="#" class="text-pool hover:text-pool-light">Terms of Service</a> and <a href="#" class="text-pool hover:text-pool-light">Privacy Policy</a>.</label>
        </div>

        <button type="button" routerLink="/dashboard" class="w-full bg-gradient-to-r from-pool to-pool-dark hover:from-pool-dark hover:to-pool-deep text-white py-3 rounded-xl font-bold shadow-lg shadow-pool/30 transition-all flex items-center justify-center mt-6">
          Create Account
        </button>
      </form>

      <div class="mt-8 text-center border-t border-slate-700/50 pt-6">
        <p class="text-slate-400 text-sm">Already have an account? <a routerLink="/login" class="font-bold text-white hover:text-pool transition-colors cursor-pointer">Sign In</a></p>
      </div>
    </div>
  </div>
</div>
