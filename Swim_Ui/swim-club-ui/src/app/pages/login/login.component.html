<div class="min-h-screen flex items-center justify-center bg-[url('https://images.unsplash.com/photo-1519315901367-f34ff9154fa6?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center relative">
  <!-- Overlay -->
  <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md">
    <div class="glass-dark border border-slate-700/50 rounded-3xl p-8 shadow-2xl">
      <!-- Logo -->
      <div class="flex flex-col items-center mb-8">
        <div class="w-14 h-14 bg-gradient-to-br from-pool to-pool-dark rounded-2xl flex items-center justify-center shadow-lg shadow-pool/20 mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">SwimClubOS</h1>
        <p class="text-slate-400 text-sm mt-1">Sign in to your account</p>
      </div>

      <!-- Form -->
      <form class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest mb-1.5 ml-1">Email</label>
          <div class="relative">
            <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
            <input type="email" placeholder="name@example.com" class="w-full pl-10 pr-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5 px-1">
            <label class="block text-xs font-semibold text-slate-300 uppercase tracking-widest">Password</label>
            <a href="#" class="text-xs font-semibold text-pool hover:text-pool-light transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
             <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            <input type="password" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:ring-2 focus:ring-pool focus:border-transparent transition-all shadow-sm text-white placeholder-slate-500">
          </div>
        </div>

        <div class="flex items-center">
          <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-600 bg-slate-800/50 text-pool focus:ring-pool focus:ring-offset-slate-900 border">
          <label for="remember" class="ml-2 text-sm text-slate-300">Remember me</label>
        </div>

        <button type="button" routerLink="/dashboard" class="w-full bg-gradient-to-r from-pool to-pool-dark hover:from-pool-dark hover:to-pool-deep text-white py-3 rounded-xl font-bold shadow-lg shadow-pool/30 transition-all flex items-center justify-center">
          Sign In
           <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <div class="mt-8 text-center border-t border-slate-700/50 pt-6">
        <p class="text-slate-400 text-sm">Don't have an account? <a routerLink="/register" class="font-bold text-white hover:text-pool transition-colors cursor-pointer">Register now</a></p>
      </div>
    </div>
  </div>
</div>
